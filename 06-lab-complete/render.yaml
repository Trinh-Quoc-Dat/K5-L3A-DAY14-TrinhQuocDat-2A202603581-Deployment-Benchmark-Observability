services:
  - type: web
    name: day14-trinhquocdat-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-trinhquocdat-redis
          property: connectionString
  - type: keyvalue
    name: day14-trinhquocdat-redis
    plan: free
    region: singapore
    ipAllowList: []
